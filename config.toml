# Trading News Tracker – Einstellungen
# Hier legst du fest, welche Quellen gelesen werden und was dich interessiert.
# Du kannst diese Datei selbst bearbeiten, Python-Kenntnisse brauchst du dafür nicht.

[settings]
max_age_hours = 48        # nur Artikel der letzten 48 Stunden
per_topic = 4             # so viele Artikel pro Thema im Briefing
per_source = 2            # höchstens so viele Artikel einer Quelle pro Thema (für Abwechslung)
min_score = 3             # Mindestpunktzahl, damit ein Artikel aufgenommen wird
summary_chars = 260       # Länge des Kurztexts

# ---------------------------------------------------------------
# Schwerpunkte: geben in JEDEM Thema Extrapunkte
# ---------------------------------------------------------------
[focus]
china = 3
chinese = 3
beijing = 2
arctic = 3
"northern sea route" = 4
"polar silk road" = 5
greenland = 2
wheat = 1
soybean = 2
grain = 1
corn = 1

# ---------------------------------------------------------------
# Themen: Reihenfolge = Reihenfolge im Briefing
# keywords: Wort = Punkte. Kleinschreiben; "sanction" findet auch "sanctions".
#           Treffer im Titel zählen doppelt.
# exclude:  (optional) Artikel mit diesen Wörtern landen nie in diesem Thema
# ---------------------------------------------------------------
[[topics]]
id = "geopolitics"
title = "Geopolitik"
per_topic=3
keywords = { geopolitic = 3, sanction = 2, "south china sea" = 1, nato = 1, military = 1, diplomacy = 1, summit = 1, conflict = 1, security = 1, russia = 1, "strait" = 1, tension = 1 }

[[topics]]
id = "geoeconomics"
title = "Geoökonomie"
per_topic=4
keywords = { tariff = 2, "trade war" = 2, "export control" = 2, "supply chain" = 3, "rare earth" = 1, "critical mineral" = 3, economy = 1, gdp = 2, yuan = 3, investment = 3, "belt and road" = 4, wto = 3, subsid = 2, "trade deal" = 3, inflation = 1 }

[[topics]]
id = "commodities"
title = "Warenhandel & Agrar"
per_topic=3
keywords = { wheat = 1, soybean = 2, soy = 1, grain = 1, corn = 1, maize = 1, rice = 1, fertili = 2, commodit = 4, harvest = 2, crop = 1, "food security" = 4, import = 1, export = 1, cargo = 3, oil = 1, lng = 1, copper = 2, "iron ore" = 2 }

[[topics]]
id = "maritime"
title = "Maritimer Handel"
per_topic=4
keywords = { shipping = 3, vessel = 2, port = 3, container = 3, freight = 2, tanker = 1, "bulk carrier" = 3, "dry bulk" = 3, shipowner = 3, "northern sea route" = 5, icebreaker = 4, maritime = 2, "shipping lane" = 3, cosco = 5, maersk = 3, hapag-lloyd = 5 }

[[topics]]
id = "logistics"
title = "Logistik-Innovation"
per_topic=2
exclude = ["military", "warfare", "weapon", "army", "air show", "killer robot", "missile"]
keywords = { "smart factor" = 4, logistic = 2, warehouse = 3, automation = 3, autonomous = 3, drone = 3, robot = 3, ai = 3, digitali = 2, "last mile" = 1, tracking = 2, "green shipping" = 2, decarboni = 1, innovation = 2, startup = 2, technology = 1 }

[[topics]]
id = "tech"
title = "Zukunftstechnologien"
per_topic=3
keywords = { quantum = 5, semiconductor = 3, chip = 2, "artificial intelligence" = 3, fusion = 4, battery = 2, superconduct = 4, breakthrough = 3, physicist = 2, computing = 2, research = 1 }

