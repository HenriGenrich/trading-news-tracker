<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Briefing – {{DATE}}</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --text: #1d2430; --muted: #6b7280;
    --line: #e4e2db; --accent: #0f5c8c; --accent-soft: #e3eef6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161d; --card: #1b212b; --text: #e6e8eb; --muted: #9aa3af;
      --line: #2a313d; --accent: #6fb3e0; --accent-soft: #1f3445;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 16px 60px; }
  header h1 { margin: 0; font-size: 1.7rem; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--muted); }
  nav {
    position: sticky; top: 0; z-index: 2; background: var(--bg);
    display: flex; gap: 8px; overflow-x: auto; padding: 14px 0; margin-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  nav a {
    flex: none; text-decoration: none; color: var(--accent); background: var(--accent-soft);
    padding: 5px 12px; border-radius: 999px; font-size: 0.88rem; white-space: nowrap;
  }
  nav a span { opacity: 0.7; margin-left: 2px; }
  section { padding-top: 18px; scroll-margin-top: 64px; }
  h2 { font-size: 1.15rem; margin: 0 0 10px; }
  article {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  article .title { color: var(--text); font-weight: 600; text-decoration: none; }
  article .title:hover { color: var(--accent); text-decoration: underline; }
  article p { margin: 6px 0 0; color: var(--muted); font-size: 0.94rem; }
  .meta { margin-top: 8px; font-size: 0.8rem; color: var(--muted); }
  .empty { color: var(--muted); font-style: italic; }
  footer { margin-top: 36px; font-size: 0.8rem; color: var(--muted); }
  footer span { text-decoration: underline dotted; cursor: help; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Daily Briefing</h1>
    <p>{{DATE}} · erstellt um {{TIME}} Uhr (Peking)</p>
  </header>
  <nav>{{NAV}}</nav>
  {{SECTIONS}}
  <footer>
    <p>{{HEALTH}}</p>
    <p>Trading News Tracker · <a href="https://github.com/HenriGenrich/trading-news-tracker">Quellcode auf GitHub</a></p>
  </footer>
</div>
</body>
</html>
